name: 'vump check'
description: 'Verify all version files tracked by vump.toml match the given version. Fails with a clear report if any file does not match.'

inputs:
  version:
    description: 'Version to verify. Accepts bare semver (1.2.3) or v-prefixed (v1.2.3).'
    required: true
  config:
    description: 'Path to vump.toml, relative to the repository root. The action runs vump from the directory containing this file.'
    required: false
    default: 'vump.toml'
  project:
    description: 'Project to verify, in a repository declaring several. Only needed when `version` is a bare version: a tag selects its own project through that project''s tag_pattern. There is deliberately no allow-nested input — a vump.toml nested below another verifies the wrong project, and this action failing is that being caught rather than a limitation.'
    required: false
    default: ''
  vump-version:
    description: 'vump release tag to download (e.g. v0.2.0). Defaults to "latest".'
    required: false
    default: 'latest'

runs:
  using: composite
  steps:
    - name: Download vump binary
      shell: bash
      env:
        VUMP_VERSION_INPUT: ${{ inputs.vump-version }}
      run: ${{ github.action_path }}/download-vump.sh

    - name: Run vump check
      shell: bash
      # Inputs reach the script through the environment rather than being
      # interpolated into it: an expression expanded into a shell line is
      # expanded before bash sees it, so a value containing shell syntax would
      # run as part of this step.
      env:
        VUMP_VERSION_TO_CHECK: ${{ inputs.version }}
        VUMP_CONFIG: ${{ inputs.config }}
        VUMP_PROJECT: ${{ inputs.project }}
        VUMP_WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail

        # cd to the directory containing vump.toml so it is found automatically.
        cd "$(dirname "$VUMP_WORKSPACE/$VUMP_CONFIG")"

        if [ -n "$VUMP_PROJECT" ]; then
          "$VUMP_BIN" check "$VUMP_VERSION_TO_CHECK" --project "$VUMP_PROJECT"
        else
          "$VUMP_BIN" check "$VUMP_VERSION_TO_CHECK"
        fi
