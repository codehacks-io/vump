    <title>vump — one version, every file, one command</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="vump" />
    <meta property="og:title" content="vump — one version, every file, one command" />
    <meta
      property="og:description"
      content="Bump every file that records your version at once — then commit, tag, and verify the tag in CI."

    <script>
      // Runs before first paint. The theme resolved in React would flash the
      // wrong one first, and the .js marker gates the entrance animations so
      // that a client without scripting gets the prerendered page as it stands.
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        try {
          var stored = localStorage.getItem('vump-theme');
          var system = window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark';
          root.dataset.theme = stored === 'light' || stored === 'dark' ? stored : system;
        } catch (_) {
          root.dataset.theme = 'dark';
        }
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "vump",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "macOS, Linux, Windows",
        "description": "Keep semver version numbers in sync across the files of a repository, and verify in CI that a released tag matches what is recorded in source.",
        "url": "https://vump.codehacks.io/",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
